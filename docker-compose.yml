version: '3.8'

services:
  router:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SERVER_PORT=3000
      - CLIENT_PORT=3001
      - CORE_DB_PATH=/data/core.db
      - ANALYTICS_DB_PATH=/data/analytics.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - router-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  router-data:
